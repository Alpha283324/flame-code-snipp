<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="11hKy6jPcSNpN2uGKkODkPFzCWgvKBn1coeklM3cd8k" />
<title>Code Snippet Hub</title>

<!-- Prism.js syntax highlighting -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap');

  body {
      background-color: #000d21;
      color: white;
      font-family: "Doto", sans-serif;
      font-optical-sizing: auto;
      font-style: bold;
      font-variation-settings:
      "ROND" 0;
  }
  div#topBar {
    display: flex;
    gap: 10px;
  }

  div#topBar {
    display: flex;
    gap: 10px;
    background: black;
    padding: 10px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topBar">
  <strong>🔥 Code Snippet Hub</strong>
  <div>
    <a href="tutorial.html">Tutorial</a>
    <button id="topLoginButton">Login</button>
  </div>
</div>

<div id="spacer"></div>

<h1>🔥 Code Snippet Hub</h1>

<!-- Add Snippet Section -->
<div id="addSnippetSection" style="display:none;">
  <h2>Add Snippet</h2>
  <input type="text" id="title" placeholder="Snippet Title" />
  <select id="language">
    <option value="Python">Python</option>
    <option value="JavaScript">JavaScript</option>
    <option value="C++">C++</option>
    <option value="HTML/CSS">HTML/CSS</option>
  </select>
  <textarea id="code" placeholder="Your code here..." rows="6"></textarea>
  <button onclick="addSnippet()">Add Snippet</button>
</div>

<hr />

<h2>Browse Snippets</h2>
<select id="sortOption" onchange="displaySnippets()">
  <option value="newest">Newest</option>
  <option value="mostLiked">Most Liked</option>
  <option value="favorites">My Favorites</option>
  <option value="liked">My Liked</option>
</select>
<input type="text" id="search" placeholder="Search..." oninput="displaySnippets()" />
<div id="snippets"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBccuRYZGgvaG5T2LSmnOrbsvGY_T79tsc",
    authDomain: "fz0-api.firebaseapp.com",
    databaseURL: "https://fz0-api-default-rtdb.firebaseio.com",
    projectId: "fz0-api",
    storageBucket: "fz0-api.firebasestorage.app",
    messagingSenderId: "787239976897",
    appId: "1:787239976897:web:0ec2db2a6227081f627940",
    measurementId: "G-XQDKW1QSMV"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentUser = null;
  const topLoginButton = document.getElementById("topLoginButton");
  topLoginButton.onclick = () => window.location.href = "portal.html";

  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (user) {
      topLoginButton.style.display = "none";
      document.getElementById("addSnippetSection").style.display = "block";
    }
    displaySnippets();
  });

  async function addSnippet() {
    if (!currentUser) return alert("Login first.");
    const title = document.getElementById("title").value.trim();
    const language = document.getElementById("language").value;
    const code = document.getElementById("code").value.trim();
    if (!title || !code) return;
    await db.collection("snippets").add({
      title,
      language,
      code,
      user: currentUser.displayName || currentUser.email,
      userId: currentUser.uid,
      likes: [],
      dislikes: [],
      favorites: [],
      comments: [],
      createdAt: Date.now()
    });
    document.getElementById("title").value = "";
    document.getElementById("code").value = "";
  }

  function displaySnippets() {
    const search = document.getElementById("search").value.toLowerCase();
    const sort = document.getElementById("sortOption").value;
    const container = document.getElementById("snippets");
    container.innerHTML = "";

    db.collection("snippets").onSnapshot(snapshot => {
      container.innerHTML = "";
      let snippets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      if (sort === "mostLiked")
        snippets.sort((a, b) => b.likes.length - a.likes.length);
      else if (sort === "favorites" && currentUser)
        snippets = snippets.filter(s => s.favorites.includes(currentUser.uid));
      else if (sort === "liked" && currentUser)
        snippets = snippets.filter(s => s.likes.includes(currentUser.uid));
      else
        snippets.sort((a, b) => b.createdAt - a.createdAt);

      snippets = snippets.filter(s =>
        (s.title + s.language + s.code).toLowerCase().includes(search)
      );

      snippets.forEach(s => {
        const div = document.createElement("div");
        div.className = "snippet";

        const escapedCode = s.code.replace(/&/g,"&amp;")
                                  .replace(/</g,"&lt;")
                                  .replace(/>/g,"&gt;");
        const langClass = "language-" + s.language.toLowerCase().replace(/[^a-z]/g,'');

        div.innerHTML = `
          <strong>${s.title}</strong> [${s.language}]<br>
          <small>by ${s.user || "Anonymous"}</small>
          <pre><code class="${langClass}">${escapedCode}</code></pre>
          <div class="actions">
            <button onclick="toggleLike('${s.id}')">👍 ${s.likes.length}</button>
            <button onclick="toggleDislike('${s.id}')">👎 ${s.dislikes.length}</button>
            <button onclick="toggleFavorite('${s.id}')">⭐ ${s.favorites.length}</button>
          </div>
          <h4>Comments</h4>
          <div id="comments-${s.id}"></div>
          <input type="text" id="commentInput-${s.id}" placeholder="Write a comment..." />
          <button onclick="addComment('${s.id}')">Post</button>
        `;
        container.appendChild(div);
        renderComments(s.id, s.comments);
      });

      Prism.highlightAll(); // Re-run Prism after dynamic content
    });
  }

  function renderComments(snippetId, comments) {
    const container = document.getElementById(`comments-${snippetId}`);
    container.innerHTML = "";
    comments.forEach(c => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<small>${c.user}</small>: ${c.text}`;
      container.appendChild(div);
    });
  }

  async function toggleLike(id) {
    if (!currentUser) return alert("Login required.");
    const ref = db.collection("snippets").doc(id);
    const doc = await ref.get();
    const data = doc.data();
    const uid = currentUser.uid;
    let likes = data.likes || [];
    let dislikes = data.dislikes || [];
    if (likes.includes(uid)) likes = likes.filter(u => u !== uid);
    else likes.push(uid);
    dislikes = dislikes.filter(u => u !== uid);
    await ref.update({ likes, dislikes });
  }

  async function toggleDislike(id) {
    if (!currentUser) return alert("Login required.");
    const ref = db.collection("snippets").doc(id);
    const doc = await ref.get();
    const data = doc.data();
    const uid = currentUser.uid;
    let likes = data.likes || [];
    let dislikes = data.dislikes || [];
    if (dislikes.includes(uid)) dislikes = dislikes.filter(u => u !== uid);
    else dislikes.push(uid);
    likes = likes.filter(u => u !== uid);
    await ref.update({ likes, dislikes });
  }

  async function toggleFavorite(id) {
    if (!currentUser) return alert("Login required.");
    const ref = db.collection("snippets").doc(id);
    const doc = await ref.get();
    const data = doc.data();
    const uid = currentUser.uid;
    let favorites = data.favorites || [];
    if (favorites.includes(uid))
      favorites = favorites.filter(u => u !== uid);
    else favorites.push(uid);
    await ref.update({ favorites });
  }

  async function addComment(id) {
    if (!currentUser) return alert("Login required.");
    const input = document.getElementById(`commentInput-${id}`);
    const text = input.value.trim();
    if (!text) return;
    const ref = db.collection("snippets").doc(id);
    const doc = await ref.get();
    const data = doc.data();
    const comments = data.comments || [];
    comments.push({ user: currentUser.displayName || currentUser.email, text, time: Date.now() });
    await ref.update({ comments });
    input.value = "";
  }
</script>

</body>
</html>
