<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="11hKy6jPcSNpN2uGKkODkPFzCWgvKBn1coeklM3cd8k" />
<meta name="description" content="Code Snippet Hub — discover, share, like, and manage programming snippets across multiple languages. Built for developers.">
<title>Code Snippet Hub</title>

<!-- Prism -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap');

:root {
  --bg: #000d21;
  --panel: #020b1f;
  --accent: #4da3ff;
  --danger: #ff4d4d;
  --border: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #06173a, var(--bg));
  color: white;
  font-family: "Doto", sans-serif;
}

a { color: var(--accent); text-decoration: none; }

h1, h2 { letter-spacing: 1px; }

#topBar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #020b1f, #020f2a);
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

#topBar button {
  background: var(--accent);
  color: black;
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}

#addSnippetSection,
.snippet {
  background: var(--panel);
  padding: 16px;
  margin-top: 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
}

input, textarea, select {
  width: 100%;
  background: #020814;
  color: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  margin-top: 8px;
  font-family: inherit;
}

button {
  margin-top: 10px;
  background: #1c2d5a;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}

button:hover { background: #2a3e7a; }

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.deleteBtn {
  background: var(--danger);
}

.deleteBtn:hover {
  background: #ff1f1f;
}

pre {
  margin-top: 10px;
  border-radius: 12px;
  overflow-x: auto;
}

.comment {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}

hr {
  border: none;
  height: 1px;
  background: var(--border);
  margin: 30px 0;
}
</style>
</head>

<body>

<div id="topBar">
  <strong>🔥 Code Snippet Hub</strong>
  <div>
    <a href="tutorial.html">Tutorial</a>
    <button id="topLoginButton">Login</button>
  </div>
</div>

<h1>🔥 Code Snippet Hub</h1>

<div id="addSnippetSection" style="display:none;">
  <h2>Add Snippet</h2>
  <input id="title" placeholder="Snippet Title">
  <select id="language">
    <option>Python</option>
    <option>JavaScript</option>
    <option>C++</option>
    <option>HTML/CSS</option>
  </select>
  <textarea id="code" rows="6" placeholder="Your code here..."></textarea>
  <button onclick="addSnippet()">Add Snippet</button>
</div>

<hr>

<h2>Browse Snippets</h2>
<select id="sortOption" onchange="displaySnippets()">
  <option value="newest">Newest</option>
  <option value="mostLiked">Most Liked</option>
  <option value="favorites">My Favorites</option>
  <option value="liked">My Liked</option>
</select>

<input id="search" placeholder="Search..." oninput="displaySnippets()">
<div id="snippets"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBccuRYZGgvaG5T2LSmnOrbsvGY_T79tsc",
  authDomain: "fz0-api.firebaseapp.com",
  projectId: "fz0-api"
});

const db = firebase.firestore();
const auth = firebase.auth();
let currentUser = null;

document.getElementById("topLoginButton").onclick =
  () => location.href = "portal.html";

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    document.getElementById("topLoginButton").style.display = "none";
    document.getElementById("addSnippetSection").style.display = "block";
  }
  displaySnippets();
});

async function addSnippet() {
  if (!currentUser) return;
  await db.collection("snippets").add({
    title: title.value.trim(),
    language: language.value,
    code: code.value.trim(),
    user: currentUser.displayName || currentUser.email,
    userId: currentUser.uid,
    likes: [],
    dislikes: [],
    favorites: [],
    comments: [],
    createdAt: Date.now()
  });
  title.value = code.value = "";
}

function displaySnippets() {
  db.collection("snippets").onSnapshot(snap => {
    snippets.innerHTML = "";
    let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const q = search.value.toLowerCase();
    const sort = sortOption.value;

    if (sort === "mostLiked") data.sort((a,b)=>b.likes.length-a.likes.length);
    else data.sort((a,b)=>b.createdAt-a.createdAt);

    data.filter(s => (s.title+s.code).toLowerCase().includes(q))
    .forEach(s => {
      const isOwner = currentUser && s.userId === currentUser.uid;
      const div = document.createElement("div");
      div.className = "snippet";

      div.innerHTML = `
        <strong>${s.title}</strong> [${s.language}]<br>
        <small>by ${s.user}</small>
        <pre><code class="language-${s.language.toLowerCase().replace(/[^a-z]/g,'')}">
${s.code.replace(/</g,"&lt;")}
        </code></pre>

        <div class="actions">
          <button onclick="toggleLike('${s.id}')">👍 ${s.likes.length}</button>
          <button onclick="toggleDislike('${s.id}')">👎 ${s.dislikes.length}</button>
          <button onclick="toggleFavorite('${s.id}')">⭐ ${s.favorites.length}</button>
          ${isOwner ? `<button class="deleteBtn" onclick="deleteSnippet('${s.id}')">🗑 Delete</button>` : ""}
        </div>
      `;
      snippets.appendChild(div);
    });
    Prism.highlightAll();
  });
}

async function deleteSnippet(id) {
  if (!currentUser) return;
  if (!confirm("Delete this snippet permanently?")) return;
  const ref = db.collection("snippets").doc(id);
  const doc = await ref.get();
  if (doc.data().userId !== currentUser.uid) return;
  await ref.delete();
}

async function toggleLike(id) {
  if (!currentUser) return;
  const ref = db.collection("snippets").doc(id);
  const d = (await ref.get()).data();
  const uid = currentUser.uid;
  let likes = d.likes.filter(u=>u!==uid);
  let dislikes = d.dislikes.filter(u=>u!==uid);
  if (!d.likes.includes(uid)) likes.push(uid);
  await ref.update({ likes, dislikes });
}

async function toggleDislike(id) {
  if (!currentUser) return;
  const ref = db.collection("snippets").doc(id);
  const d = (await ref.get()).data();
  const uid = currentUser.uid;
  let dislikes = d.dislikes.filter(u=>u!==uid);
  let likes = d.likes.filter(u=>u!==uid);
  if (!d.dislikes.includes(uid)) dislikes.push(uid);
  await ref.update({ likes, dislikes });
}

async function toggleFavorite(id) {
  if (!currentUser) return;
  const ref = db.collection("snippets").doc(id);
  const d = (await ref.get()).data();
  const uid = currentUser.uid;
  let fav = d.favorites.includes(uid)
    ? d.favorites.filter(u=>u!==uid)
    : [...d.favorites, uid];
  await ref.update({ favorites: fav });
}
</script>

</body>
</html>
